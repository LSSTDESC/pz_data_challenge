---
# This workflow will install Python dependencies and run tests

name: Unit test and code coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
        submission: ['kernelpool']

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install libbz2-dev
          python -m pip install --upgrade pip
          pip install wheel
          pip install .
          pip install .[dev]
          if [ -f requirements_${{ matrix.submission }}.txt ]; then pip install -r requirements_${{ matrix.submission }}.txt; fi
      - name: Run unit tests with pytest
        # kernelpool trains 3 estimators per combination (8 combinations); a full-scale retrain exceeds the CI budget.
        # PZDC_CI_MAX_TRAIN subsamples the training file for CI (validity smoke test); the shipped full-scale models and
        # estimates (release tgz) carry the real performance and feed the estimation-only path. 0 = full data.
        env:
          PZDC_CI_MAX_TRAIN: "6000"
        run: |
          python -m pytest tests/test_${{ matrix.submission }}.py
