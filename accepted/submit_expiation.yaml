---
# CI workflow for the expiation (Pontifex-powered) photo-z submission.

name: Unit test and code coverage (expiation)

on:
  push:
    branches: [main, expiation]
  pull_request:
    branches: [main, expiation]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        submission: ['expiation']

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          PONTIFEX_PAT: ${{ secrets.PONTIFEX_PAT }}
        run: |
          sudo apt-get update
          sudo apt install libbz2-dev
          python -m pip install --upgrade pip
          pip install wheel
          pip install .
          pip install .[dev]
          if [ -n "$PONTIFEX_PAT" ]; then
            pip install "git+https://${PONTIFEX_PAT}@github.com/mardom/Pontifex.git@main#egg=pontifex"
          fi
          if [ -f requirements_${{ matrix.submission }}.txt ]; then pip install -r requirements_${{ matrix.submission }}.txt || true; fi
          if [ -f requirements_rail_aion.txt ]; then pip install -r requirements_rail_aion.txt; fi
      - name: Run unit tests with pytest
        env:
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_PYTHON_CLIENT_ALLOCATOR: "platform"
          XLA_PYTHON_CLIENT_MEM_FRACTION: ".10"
          PZDC_CI_MAX_TRAIN: "500"
        run: |
          python -m pytest tests/test_${{ matrix.submission }}.py
